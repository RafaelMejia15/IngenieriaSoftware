services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: automecture_user
      POSTGRES_PASSWORD: automecture_pass_01
      POSTGRES_DB: automecture_database
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build: 
      context: ./backend
    volumes:
      - ./backend:/app
    restart: unless-stopped
    ports:
      - "8500:8500"
    environment:
      - DATABASE_URL=postgresql://automecture_user:automecture_pass_01@db:5432/automecture_database
      - VERIFICATION_BASE_URL=https://d561t2pbktp9t.cloudfront.net
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - EMAIL_FROM=${EMAIL_FROM}
      - JWT_SECRET=${JWT_SECRET:-dev-change-in-production}
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRE_MINUTES=60
      # Front y API en dominios distintos: cookie SameSite=None + Secure; CORS con credenciales
      - COOKIE_CROSS_SITE=true
      # Orígenes permitidos (lista separada por comas); o usar CORS_ALLOW_ALL=true para desarrollo
      - CORS_ORIGINS=${CORS_ORIGINS:-https://d561t2pbktp9t.cloudfront.net}
      # Si necesitas cualquier origin con credenciales (solo si asumes el riesgo): CORS_ALLOW_ALL=true
    depends_on:
      - db

volumes:
  db_data: