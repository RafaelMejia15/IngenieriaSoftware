name: Pruebas E2E (Playwright)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Permite ejecutar la prueba manualmente desde Github

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    # IMPORTANTE: Le decimos a Github que todos los comandos se corran dentro de la carpeta del Frontend
    defaults:
      run:
        working-directory: MobileApps/SIPID

    steps:
    - name: Descargar código fuente
      uses: actions/checkout@v4
    
    - name: Instalar pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 10 # La versión que usas actualmente

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'pnpm'
        cache-dependency-path: MobileApps/SIPID/pnpm-lock.yaml

    - name: Instalar dependencias del proyecto
      run: pnpm install

    - name: Instalar navegadores de Playwright
      run: pnpm exec playwright install --with-deps

    - name: Ejecutar pruebas automatizadas
      run: pnpm test:e2e
      env:
        # Si quieres probar en producción, Github tomará este secreto que configuras en tu repo
        BASE_URL: ${{ secrets.PROD_URL }} 
        # Si PROD_URL no existe, tomará por defecto http://localhost:8081 (aunque fallará si no levantas tu app en el CI)
        
    - name: Subir reporte y videos de evidencia
      uses: actions/upload-artifact@v4
      if: always() # Siempre sube la evidencia, pasen o fallen las pruebas
      with:
        name: reporte-evidencia-playwright
        path: MobileApps/SIPID/playwright-report/
        retention-days: 30
